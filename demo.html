<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Demo Mode - Projector & Remote Side-by-Side</title>
    <style>
        :root {
            --bg: #0b0d14;
            --border: #1e2436;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body {
            background: var(--bg);
            color: #fff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        header {
            background: #141724;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }
        .header-title {
            font-weight: bold;
            color: #00d2ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge {
            background: rgba(0, 210, 255, 0.2);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            color: #00d2ff;
        }
        #workspace {
            flex: 1;
            display: flex;
            height: calc(100vh - 45px);
        }
        /* Lewa strona: Ekran projektora / podgląd ściany */
        #projectorPane {
            flex: 1.3;
            background: #000;
            position: relative;
            border-right: 2px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        .pane-label {
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.2);
            color: #8b9bb4;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 6px;
            z-index: 50;
            pointer-events: none;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Prawa strona: Ekran telefonu (wirtualny smartfon) */
        #remotePane {
            flex: 1;
            max-width: 440px;
            background: #10131d;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        @media (max-width: 768px) {
            #workspace {
                flex-direction: column;
            }
            #projectorPane {
                flex: 1;
                border-right: none;
                border-bottom: 2px solid var(--border);
            }
            #remotePane {
                flex: 1.5;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">
            📽️ MAPING DEMO LAB <span class="badge">Side-by-Side</span>
        </div>
        <div style="color: #8b9bb4; font-size: 0.8rem;">
            Both windows auto-connected via Demo PIN: <b style="color:#00ff88;">7777</b>
        </div>
    </header>

    <div id="workspace">
        <!-- PODGLĄD ŚCIANY PROJEKTORA -->
        <div id="projectorPane">
            <span class="pane-label">🖥️ PROJECTOR SIMULATOR</span>
            <iframe id="displayFrame" src="display.html?demo=7777"></iframe>
        </div>

        <!-- PILOT W TELEFONIE -->
        <div id="remotePane">
            <span class="pane-label">📱 REMOTE CONTROLLER</span>
            <iframe id="remoteFrame" src="remote.html?pin=7777&token=demo-secret-777"></iframe>
        </div>
    </div>
</body>
</html>
